{% macro password_input(name, placeholder, autocomplete, minlength=none, describedby=none) %}
<div class="pw-wrap">
  <input type="password" id="{{ name }}" name="{{ name }}"
         placeholder="{{ placeholder }}" autocomplete="{{ autocomplete }}" required
         {% if minlength %}minlength="{{ minlength }}"{% endif %}
         {% if describedby %}aria-describedby="{{ describedby }}"{% endif %}>
  <button type="button" class="pw-toggle" data-toggle-pw
          aria-label="Show password" aria-pressed="false">
    <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
    <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
      <line x1="1" y1="1" x2="23" y2="23"/>
    </svg>
  </button>
</div>
{% endmacro %}
