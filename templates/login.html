{% extends "auth_base.html" %}

{% block title %}Log in{% endblock %}

{% block heading %}
<h1 class="auth-main-title">WELCOME BACK!</h1>
<p class="auth-subtitle">Please enter your credentials to access the sales records.</p>
{% endblock %}

{% block card %}
<form method="post" class="auth-form" data-loading-text="LOGGING IN..." novalidate>

    <div class="auth-input-group">
        <div class="auth-label-row">
            <label for="username" class="auth-label">Username</label>
            <span class="auth-tag-required">Required</span>
        </div>
        <input type="text" id="username" name="username" class="auth-input"
               placeholder="Enter your username" value="{{ request.form.get('username', '') }}"
               required autofocus autocomplete="username" autocapitalize="none" spellcheck="false">
    </div>

    <div class="auth-input-group">
        <div class="auth-label-row">
            <label for="password" class="auth-label">Password</label>
        </div>
        <div class="auth-pwd-wrap">
            <input type="password" id="password" name="password" class="auth-input"
                   placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="auth-pwd-toggle" data-toggle-pw aria-label="Show password" aria-pressed="false">
                <svg class="icon-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
        </div>
    </div>

    <label class="auth-remember-row" for="remember">
        <input type="checkbox" id="remember" name="remember" value="1" class="auth-checkbox">
        <span>Remember me on this device</span>
    </label>

    <button type="submit" class="auth-btn-primary"><span>LOG IN</span></button>
</form>

<div class="auth-footer-link">
    <span>New here?</span>
    <a href="{{ url_for('auth.register') }}" class="auth-switch-link">Create an account</a>
</div>
{% endblock %}
